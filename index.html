<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lead Bin Lookup</title>
<style>
  :root{
    --bg:#17181B;
    --panel:#1F2125;
    --panel-raised:#26282D;
    --ink:#EDEBE4;
    --ink-dim:#8E9096;
    --amber:#FF8A34;
    --amber-dim:#7A4A22;
    --line:#34363B;
    --danger:#E5484D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 60px;
  }

  @font-face{
    font-family:'IBM Plex Mono';
    src:local('Courier New');
  }

  .brand{
    width:100%;
    max-width:520px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand-title{
    font-size:13px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-dim);
    font-weight:600;
  }
  .brand-title b{color:var(--amber);}
  .brand-count{
    font-size:11px;
    color:var(--ink-dim);
    font-variant-numeric:tabular-nums;
  }

  .search-wrap{
    width:100%;
    max-width:520px;
    position:relative;
  }
  .search-input{
    width:100%;
    font-size:28px;
    font-family:'IBM Plex Mono',Consolas,monospace;
    font-weight:600;
    letter-spacing:0.04em;
    padding:18px 20px;
    background:var(--panel);
    border:2px solid var(--line);
    border-radius:10px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  .search-input::placeholder{
    color:#54565C;
    font-weight:500;
    font-size:18px;
  }
  .search-input:focus{border-color:var(--amber);}

  .hint{
    max-width:520px;
    width:100%;
    font-size:12px;
    color:var(--ink-dim);
    margin-top:8px;
    padding-left:2px;
  }

  .results{
    width:100%;
    max-width:520px;
    margin-top:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:16px;
  }

  .tag{
    flex:0 0 auto;
    background:var(--panel-raised);
    border:1.5px dashed var(--amber-dim);
    border-radius:6px;
    padding:10px 12px;
    text-align:center;
    min-width:96px;
  }
